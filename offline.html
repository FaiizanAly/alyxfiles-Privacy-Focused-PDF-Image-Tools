<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline – alyxfiles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F5F5F7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1d1d1f;
      margin-bottom: 24px;
      display: inline-block;
    }

    .logo span {
      color: #E53935;
    }

    .icon-wrap {
      width: 72px;
      height: 72px;
      background: #FFF5F5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #E53935;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1d1d1f;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #6e6e73;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #E53935;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, transform 0.1s ease;
      text-decoration: none;
    }

    .btn:hover {
      background: #c62828;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 13px;
      color: #aeaeb2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">aly<span>x</span>files</div>
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Connect to the internet to load new files or access all features.<br />All previously cached tools remain functional offline.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <p class="footer-note">alyxfiles — Privacy-focused PDF &amp; image tools</p>
  </div>
</body>
</html>
